# GitHub repo -> Jenkins stage job(s). Copied from the build-trigger Lambda's
# REPO_TO_JENKINS_JOB. Paths are relative to the Jenkins URL. A "?k=v" suffix
# turns the call into /buildWithParameters with those parameters.
#
# This file is compiled into the binary. To change the mapping without
# rebuilding, copy it to ~/.config/sts/jobs.toml and edit that copy.

[repos]
"Blitzscale-19/alfred" = ["/job/stage/job/web/job/dashboard/build?ENV=stage"]
